<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔐 تسجيل الدخول - بوت حمزة اعمرني</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg: #080c14;
      --card: #0f172a;
      --border: rgba(16, 185, 129, 0.25);
      --accent: #10b981;
      --accent2: #059669;
      --blue: #06b6d4;
      --purple: #8b5cf6;
      --red: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(37,211,102,0.12) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(99,179,237,0.10) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 10%, rgba(159,122,234,0.08) 0%, transparent 50%);
      pointer-events: none;
      animation: bgPulse 6s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      from { opacity: 0.7; }
      to   { opacity: 1; }
    }

    /* Floating particles */
    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .particle {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.3; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Login card */
    .login-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: linear-gradient(135deg, rgba(17,24,39,0.95), rgba(26,34,53,0.95));
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px 40px;
      backdrop-filter: blur(20px);
      box-shadow:
        0 25px 60px rgba(0,0,0,0.5),
        0 0 0 1px rgba(37,211,102,0.05),
        inset 0 1px 0 rgba(255,255,255,0.05);
      animation: slideUp 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes slideUp {
      from { transform: translateY(40px) scale(0.95); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Logo */
    .logo-wrap {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-icon {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 16px;
      box-shadow: 0 0 30px rgba(37,211,102,0.35), 0 0 60px rgba(37,211,102,0.15);
      animation: logoPulse 3s ease-in-out infinite;
      position: relative;
    }
    .logo-icon::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid rgba(37,211,102,0.3);
      animation: ripple 2s ease-out infinite;
    }
    @keyframes ripple {
      0%   { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 30px rgba(37,211,102,0.35), 0 0 60px rgba(37,211,102,0.15); }
      50%       { box-shadow: 0 0 45px rgba(37,211,102,0.55), 0 0 80px rgba(37,211,102,0.25); }
    }

    .logo-title {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .logo-sub {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-label i { color: var(--accent); font-size: 13px; }

    .input-wrap {
      position: relative;
    }
    .form-input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      font-weight: 500;
      outline: none;
      transition: all 0.25s;
      direction: rtl;
    }
    .form-input:focus {
      border-color: var(--accent);
      background: rgba(37,211,102,0.05);
      box-shadow: 0 0 0 4px rgba(37,211,102,0.10), 0 4px 20px rgba(37,211,102,0.08);
    }
    .form-input::placeholder { color: var(--text-muted); }

    .toggle-pw {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--accent); }
    #password { padding-left: 44px; }

    /* Error msg */
    .error-msg {
      display: none;
      background: rgba(252,129,129,0.1);
      border: 1px solid rgba(252,129,129,0.3);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--red);
      margin-bottom: 20px;
      text-align: center;
      animation: shake 0.4s ease;
    }
    .error-msg.show { display: flex; align-items: center; justify-content: center; gap: 8px; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60%  { transform: translateX(-8px); }
      40%, 80%  { transform: translateX(8px); }
    }

    /* Login button */
    .btn-login {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 25px rgba(37,211,102,0.3);
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(37,211,102,0.4);
    }
    .btn-login:active { transform: translateY(0); }
    .btn-login::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
      transform: translateX(-100%);
      transition: transform 0.5s;
    }
    .btn-login:hover::after { transform: translateX(100%); }

    .btn-login .btn-icon { margin-left: 8px; }

    /* Loading state */
    .btn-login.loading {
      pointer-events: none;
      opacity: 0.8;
    }
    .btn-login.loading .btn-text { display: none; }
    .btn-login .spinner { display: none; }
    .btn-login.loading .spinner { display: inline-block; }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .login-footer span { color: var(--accent); font-weight: 700; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.06);
    }

    /* Secure badge */
    .secure-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 20px;
    }
    .secure-badge i { color: var(--accent); font-size: 11px; }

    /* Success overlay */
    .success-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,14,26,0.95);
      z-index: 999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 0.3s ease;
    }
    .success-overlay.show { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .success-icon {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
      box-shadow: 0 0 50px rgba(37,211,102,0.5);
    }
    @keyframes popIn {
      from { transform: scale(0); }
      to   { transform: scale(1); }
    }
    .success-text {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
    }
    .success-sub {
      font-size: 14px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Particles -->
  <div class="particles" id="particles"></div>

  <!-- Success Overlay -->
  <div class="success-overlay" id="successOverlay">
    <div class="success-icon">✅</div>
    <div class="success-text">مرحباً بك!</div>
    <div class="success-sub">جاري الدخول للوحة التحكم...</div>
  </div>

  <div class="login-wrap">
    <div class="login-card">

      <!-- Logo -->
      <div class="logo-wrap">
        <div class="logo-icon">🤖</div>
        <div class="logo-title">بوت حمزة اعمرني</div>
        <div class="logo-sub">لوحة التحكم الإدارية</div>
      </div>

      <!-- Error message -->
      <div class="error-msg" id="errorMsg">
        <i class="fas fa-exclamation-triangle"></i>
        <span id="errorText">اسم المستخدم أو كلمة المرور غير صحيحة</span>
      </div>

      <!-- Form -->
      <form id="loginForm" onsubmit="doLogin(event)">

        <div class="form-group">
          <label class="form-label" for="username">
            <i class="fas fa-user"></i>
            اسم المستخدم
          </label>
          <input
            class="form-input"
            type="text"
            id="username"
            placeholder="أدخل اسم المستخدم..."
            autocomplete="username"
            autofocus
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            <i class="fas fa-lock"></i>
            كلمة المرور
          </label>
          <div class="input-wrap">
            <input
              class="form-input"
              type="password"
              id="password"
              placeholder="أدخل كلمة المرور..."
              autocomplete="current-password"
            />
            <button type="button" class="toggle-pw" id="togglePw" onclick="togglePassword()">
              <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text">
            <i class="fas fa-sign-in-alt btn-icon"></i>
            دخول للوحة التحكم
          </span>
          <div class="spinner"></div>
        </button>

      </form>

      <div class="secure-badge">
        <i class="fas fa-shield-alt"></i>
        اتصال آمن ومشفر
      </div>

      <div class="login-footer">
        تطوير <span>حمزة اعمرني</span> &mdash; جميع الحقوق محفوظة &copy; 2025
      </div>

    </div>
  </div>

  <script>
    // ─── Credentials ────────────────────────────────────────────────
    const USERS = [
      { user: 'hamza',  pass: '6402' }
    ];

    // ─── Particles ─────────────────────────────────────────────────
    const container = document.getElementById('particles');
    const colors = ['#25d366','#128c7e','#63b3ed','#9f7aea'];
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left   = Math.random() * 100 + 'vw';
      p.style.width  = (Math.random() * 4 + 2) + 'px';
      p.style.height = p.style.width;
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDuration  = (Math.random() * 10 + 8) + 's';
      p.style.animationDelay     = (Math.random() * 10) + 's';
      container.appendChild(p);
    }

    // ─── Toggle password visibility ─────────────────────────────────
    function togglePassword() {
      const input = document.getElementById('password');
      const icon  = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    // ─── Show error ─────────────────────────────────────────────────
    function showError(msg) {
      const el = document.getElementById('errorMsg');
      document.getElementById('errorText').textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 4000);
    }

    // ─── Already logged in? ─────────────────────────────────────────
    if (sessionStorage.getItem('bot_auth') === 'ok') {
      window.location.href = '/';
    }

    // ─── Login handler ──────────────────────────────────────────────
    function doLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const btn  = document.getElementById('loginBtn');

      if (!user || !pass) {
        showError('الرجاء إدخال اسم المستخدم وكلمة المرور');
        return;
      }

      // Loading state
      btn.classList.add('loading');

      setTimeout(() => {
        const match = USERS.find(u => u.user === user && u.pass === pass);
        if (match) {
          sessionStorage.setItem('bot_auth', 'ok');
          sessionStorage.setItem('bot_user', user);
          document.getElementById('successOverlay').classList.add('show');
          setTimeout(() => {
            window.location.href = '/';
          }, 1500);
        } else {
          btn.classList.remove('loading');
          showError('❌ اسم المستخدم أو كلمة المرور غير صحيحة!');
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      }, 900);
    }

    // Enter key support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin(e);
    });
  </script>

</body>
</html>
